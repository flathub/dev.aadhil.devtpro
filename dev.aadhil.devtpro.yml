app-id: dev.aadhil.devtpro
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: devtpro
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network

modules:
  - name: devtpro
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      # Archives up to 8.2.2 have no CLI, and the launcher below needs it.
      - test -x bundle/cli/bin/devtpro
      - mkdir -p /app/devtpro /app/bin
      - cp -a bundle/. /app/devtpro/
      - install -Dm755 devtpro-launcher /app/bin/devtpro
      - install -Dm644 flatpak/dev.aadhil.devtpro.desktop -t /app/share/applications/
      - install -Dm644 flatpak/dev.aadhil.devtpro.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 flatpak/dev.aadhil.devtpro.png -t /app/share/icons/hicolor/512x512/apps/
      - install -Dm644 legal/LICENSE.txt -t /app/share/licenses/dev.aadhil.devtpro/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://aadhil.dev/media/releases/devtpro/devtpro-linux-x86_64-9.0.0.tar.xz
        sha256: 'd5e3dfa2c909b8350725a5fa40ca21008904390650f261a12f49adf8edd68f53'
      # `flatpak run dev.aadhil.devtpro` opens the app, also for devtpro://
      # links (the desktop file passes %U). With a command line tool command
      # it runs the bundled CLI instead, e.g.
      #   flatpak run dev.aadhil.devtpro json-format < in.json
      #   flatpak run dev.aadhil.devtpro mcp
      # CLI commands never contain ":" or start with "/", so URIs and paths
      # still reach the app.
      - type: script
        dest-filename: devtpro-launcher
        commands:
          - 'case "${1-}" in'
          - '  ""|*:*|/*) exec /app/devtpro/devtpro "$@" ;;'
          - 'esac'
          - 'export DEVTPRO_CLI_NAME="flatpak run dev.aadhil.devtpro"'
          - 'exec /app/devtpro/cli/bin/devtpro "$@"'
